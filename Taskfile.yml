version: "3"

tasks:
  default:
    silent: true
    cmds:
      - task --list

  fmt:
    desc: コードを整形する
    cmds:
      - golangci-lint fmt

  lint:
    desc: Windows 向けにリンターと整形の確認を実行する
    env:
      GOOS: windows
      GOARCH: amd64
    cmds:
      - golangci-lint run

  projectlint:
    desc: 型の置き場所や「。」など、このリポジトリ独自の規則を確認する
    cmds:
      # lint のように GOOS=windows をかけると、go run が Windows 用の実行ファイルを作って起動できない
      - go run ./cmd/projectlint

  policycheck:
    desc: update-policy.json の最低利用可能バージョンが BASE (既定 origin/main) より下がっていないか確認する
    vars:
      BASE: '{{.BASE | default "origin/main"}}'
    env:
      BASE: '{{.BASE}}'
    cmds:
      - |
        base_file=$(mktemp)
        trap 'rm -f "$base_file"' EXIT
        git show "$BASE:update-policy.json" > "$base_file" || exit 1
        go run ./cmd/policycheck "$base_file" update-policy.json

  test:
    desc: 静的検査とテストを実行する
    cmds:
      - go vet ./...
      - go test ./...

  build:
    desc: Windows 向けにビルドできるか確認する
    env:
      GOOS: windows
      GOARCH: amd64
    cmds:
      # -o を外すと、作業ディレクトリに loldatabase.exe が残る
      - go build -o /dev/null ./...

  check:
    desc: CI と同じ確認をすべて実行する
    cmds:
      - task: lint
      - task: projectlint
      - task: test
      - task: build
