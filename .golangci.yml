version: "2"

linters:
  default: all
  disable:
    # 日本語の文で行が長くなる
    - lll
    # 日本語で表示する方針と衝突する
    - gosmopolitan
    # コメントを「。」で終えない
    - godot
    - wsl
    - exhaustruct
    - gomodguard
    # wsl_v5 と重複する
    - nlreturn
    # cyclop と重複する
    - gocyclo
    # depguard の許可リストと重複する
    - gomodguard_v2

  settings:
    # 依存は必要なものだけを許可する。新しいパッケージは下のどれかに加えないと、何も読み込めない
    # 許可は前方一致なので、末尾に $ を付けて完全一致にする（path が path/filepath を、internal/champion が internal/championdata を許してしまう）
    # テストは別のパッケージ（xxx_test）から自分自身を読み込むので、自分自身も許可する
    depguard:
      rules:
        champion:
          files:
            - "**/internal/champion/**"
          list-mode: strict
          allow:
            - errors$
            - fmt$
            - strings$
            - strconv$
            - slices$
            - maps$
            - cmp$
            - unicode$
            - unicode/utf8$
            - testing$
            - github.com/sh1ro06293/lolDatabaseForCLI/internal/champion$
          deny:
            - pkg: net
              desc: 判定の層は通信しない
            - pkg: os
              desc: 判定の層は OS に触れない

        update:
          files:
            - "**/internal/update/**"
          list-mode: strict
          allow:
            - errors$
            - fmt$
            - strings$
            - strconv$
            - slices$
            - maps$
            - cmp$
            - unicode$
            - unicode/utf8$
            - testing$
            - github.com/sh1ro06293/lolDatabaseForCLI/internal/update$
          deny:
            - pkg: net
              desc: 判定の層は通信しない
            - pkg: os
              desc: 判定の層は OS に触れない

        audit:
          files:
            - "**/internal/audit/**"
          list-mode: strict
          allow:
            - errors$
            - fmt$
            - strings$
            - strconv$
            - slices$
            - maps$
            - cmp$
            - unicode$
            - unicode/utf8$
            - testing$
            - github.com/sh1ro06293/lolDatabaseForCLI/internal/audit$
            - github.com/sh1ro06293/lolDatabaseForCLI/internal/champion$
          deny:
            - pkg: net
              desc: 判定の層は通信しない
            - pkg: os
              desc: 判定の層は OS に触れない

        riot:
          files:
            - "**/internal/riot/**"
          list-mode: strict
          allow:
            - errors$
            - fmt$
            - strings$
            - strconv$
            - slices$
            - maps$
            - cmp$
            - unicode$
            - unicode/utf8$
            - testing$
            - context$
            - encoding/json$
            - io$
            - net/http$
            - net/url$
            - time$
            - net/http/httptest$
            - github.com/sh1ro06293/lolDatabaseForCLI/internal/riot$
            - github.com/sh1ro06293/lolDatabaseForCLI/internal/champion$
          deny:
            - pkg: os
              desc: 通信の層は OS に触れない

        github:
          files:
            - "**/internal/github/**"
          list-mode: strict
          allow:
            - errors$
            - fmt$
            - strings$
            - strconv$
            - slices$
            - maps$
            - cmp$
            - unicode$
            - unicode/utf8$
            - testing$
            - context$
            - encoding/json$
            - io$
            - net/http$
            - time$
            - net/http/httptest$
            - github.com/sh1ro06293/lolDatabaseForCLI/internal/github$
            - github.com/sh1ro06293/lolDatabaseForCLI/internal/update$
          deny:
            - pkg: os
              desc: 通信の層は OS に触れない

        cli:
          files:
            - "**/internal/cli/**"
          list-mode: strict
          allow:
            - errors$
            - fmt$
            - strings$
            - strconv$
            - slices$
            - maps$
            - cmp$
            - unicode$
            - unicode/utf8$
            - testing$
            - io$
            - github.com/sh1ro06293/lolDatabaseForCLI/internal/cli$
            - github.com/sh1ro06293/lolDatabaseForCLI/internal/champion$
            - github.com/sh1ro06293/lolDatabaseForCLI/internal/update$
          deny:
            - pkg: net
              desc: 画面の層は通信しない
            - pkg: os
              desc: 画面の層は OS に触れない。標準出力や引数は cmd から受け取る

        loldatabase:
          files:
            - "**/cmd/loldatabase/**"
          list-mode: strict
          allow:
            - $gostd
            - github.com/sh1ro06293/lolDatabaseForCLI/internal/cli$
            - github.com/sh1ro06293/lolDatabaseForCLI/internal/riot$
            - github.com/sh1ro06293/lolDatabaseForCLI/internal/github$

        data-audit:
          files:
            - "**/cmd/data-audit/**"
          list-mode: strict
          allow:
            - $gostd
            - github.com/sh1ro06293/lolDatabaseForCLI/internal/audit$
            - github.com/sh1ro06293/lolDatabaseForCLI/internal/riot$

        unclassified:
          files:
            - $all
            - "!**/internal/champion/**"
            - "!**/internal/update/**"
            - "!**/internal/audit/**"
            - "!**/internal/riot/**"
            - "!**/internal/github/**"
            - "!**/internal/cli/**"
            - "!**/cmd/loldatabase/**"
            - "!**/cmd/data-audit/**"
          list-mode: strict
          # 空の許可リストは設定エラーになるため、存在しない名前を置いてすべての読み込みを禁止する
          allow:
            - 層に割り当てていないパッケージ

    exhaustruct_v5:
      explicit-mode: true
      # 型の完全な名前との全体一致なので、末尾の .* を外すと何にも一致しない
      enforce-patterns:
        - github\.com/sh1ro06293/lolDatabaseForCLI/.*
      # 表形式のテストの構造体は、使わない項目を省く
      ignore-patterns:
        - .*\.<anonymous>

    staticcheck:
      # checks を書くと既定値が置き換わるので、既定で無効なものも並べる
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # 日本語のエラー文を誤検出する
        - -ST1005

    wrapcheck:
      ignore-package-globs:
        - github.com/sh1ro06293/lolDatabaseForCLI/*

    revive:
      enable-default-rules: true
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

    varnamelen:
      ignore-names:
        - tt
        - i
        - id
      ignore-decls:
        - w http.ResponseWriter
        - r *http.Request

    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - goconst
          - cyclop

formatters:
  enable:
    - gofumpt
